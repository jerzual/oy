---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  NODE_VERSION: "26"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

  build:
    runs-on: ubuntu-latest
    needs: [install]
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Prepare
        run: pnpm run prepare
      - name: Build
        id: run
        run: pnpm run build

  lint:
    runs-on: ubuntu-latest
    needs: [install]
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Prepare
        run: pnpm run prepare
      - name: Lint
        id: run
        run: pnpm run lint:github
        # continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: [install]
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Prepare
        run: pnpm run prepare
      - name: Test
        id: run
        run: pnpm run test

  format:
    runs-on: ubuntu-latest
    needs: [install]
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
      - name: Prepare
        run: pnpm run prepare
      - name: Format check
        id: run
        run: pnpm run format:check

  aggregate:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [build, lint, test, format]
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate summary
        run: |
          icon() {
            if [ "$1" = "success" ];
              then echo ":white_check_mark:";
              else echo ":x:";
            fi;
          }

          BUILD="${{ needs.build.outputs.result }}"
          LINT="${{ needs.lint.outputs.result }}"
          TEST="${{ needs.test.outputs.result }}"
          FORMAT="${{ needs.format.outputs.result }}"

          if [ "$BUILD" = "success" ] \
          && [ "$LINT" = "success" ] \
          && [ "$TEST" = "success" ] \
          && [ "$FORMAT" = "success" ]; then
            STATUS="PASSED"
            ICON=":white_check_mark:"
          else
            STATUS="FAILED"
            ICON=":x:"
          fi

          cat > commit-checks-summary.md << EOF
          ## ${ICON} Commit Checks: ${STATUS}

          | Check | Result |
          |-------|--------|
          | $(icon "$BUILD") Build | ${BUILD} |
          | $(icon "$LINT") Lint | ${LINT} |
          | $(icon "$TEST") Test | ${TEST} |
          | $(icon "$FORMAT") Format | ${FORMAT} |
          EOF

          cat commit-checks-summary.md >> "$GITHUB_STEP_SUMMARY"
